<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc">
<title id="title">HiveOS：一人一容器，文件独立保存</title>
<desc id="desc">Core管理身份与任务，Runtime Manager管理员工容器。员工甲乙分别使用自己的容器与个人持久目录。容器共享宿主Linux内核；重建系统层时重新挂载个人目录。这是Docker方案的逻辑职责示意，不是物理主机部署图。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#53687b"/></marker></defs>
<rect width="1200" height="1060" rx="24" fill="#f6f8fa"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#172d40">
<text x="60" y="57" font-size="30" font-weight="700">HiveOS：一人一容器，文件独立保存</text>
<rect x="60" y="95" width="480" height="142" rx="14" fill="#e8eef7" stroke="#aabdd7"/>
<text x="88" y="136" font-size="26" font-weight="700">Core · 平台控制</text><text x="88" y="174" font-size="21">员工身份、对话、任务与资源分配</text><text x="88" y="208" font-size="20" fill="#53687b">保存状态，提出运行环境管理请求</text>
<rect x="660" y="95" width="480" height="142" rx="14" fill="#e8eef7" stroke="#aabdd7"/>
<text x="688" y="136" font-size="26" font-weight="700">Runtime Manager · 宿主管理</text><text x="688" y="174" font-size="21">容器启停重建、文件挂载、资源限制</text><text x="688" y="208" font-size="20" fill="#53687b">宿主管理权限留在专门服务中</text>
<path d="M545 166H650" stroke="#53687b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M900 240V288H300V366M900 288V366" stroke="#53687b" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M300 340V366" stroke="#53687b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="30" y="326" width="1140" height="670" rx="22" fill="none" stroke="#a5b6bf" stroke-width="2" stroke-dasharray="8 7"/>
<rect x="60" y="312" width="570" height="30" fill="#f6f8fa"/><text x="68" y="334" font-size="20" fill="#53687b">员工执行区域 · 容器共享宿主Linux内核</text>
<rect x="60" y="385" width="480" height="290" rx="16" fill="#e9f5f0" stroke="#83b8a6" stroke-width="2"/>
<text x="88" y="429" font-size="27" font-weight="700">员工甲的容器</text><text x="88" y="469" font-size="21">Agent引擎：Hive Pi / OpenCode</text>
<rect x="84" y="491" width="432" height="112" rx="10" fill="#fff" stroke="#b6d7ca"/>
<text x="104" y="526" font-size="21">命令行、Python、Node.js、工具</text><text x="104" y="564" font-size="21">读取文件 → 执行程序 → 生成成果</text>
<text x="88" y="645" font-size="20" fill="#406556">按员工管理CPU、内存等资源</text>
<path d="M300 680V765" stroke="#53687b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="323" y="733" font-size="20" fill="#53687b">挂载</text>
<rect x="60" y="780" width="480" height="165" rx="16" fill="#fff3dd" stroke="#c9aa6d" stroke-width="2"/>
<text x="88" y="823" font-size="26" font-weight="700">员工甲的个人持久目录</text><text x="88" y="862" font-size="21">项目、资料、脚本、Skill、配置与依赖</text><text x="88" y="905" font-size="20" fill="#795d2b">放在容器系统层之外，重建后重新挂载</text><rect x="660" y="385" width="480" height="290" rx="16" fill="#e9f5f0" stroke="#83b8a6" stroke-width="2"/>
<text x="688" y="429" font-size="27" font-weight="700">员工乙的容器</text><text x="688" y="469" font-size="21">Agent引擎：Hive Pi / OpenCode</text>
<rect x="684" y="491" width="432" height="112" rx="10" fill="#fff" stroke="#b6d7ca"/>
<text x="704" y="526" font-size="21">命令行、Python、Node.js、工具</text><text x="704" y="564" font-size="21">读取文件 → 执行程序 → 生成成果</text>
<text x="688" y="645" font-size="20" fill="#406556">按员工管理CPU、内存等资源</text>
<path d="M900 680V765" stroke="#53687b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="923" y="733" font-size="20" fill="#53687b">挂载</text>
<rect x="660" y="780" width="480" height="165" rx="16" fill="#fff3dd" stroke="#c9aa6d" stroke-width="2"/>
<text x="688" y="823" font-size="26" font-weight="700">员工乙的个人持久目录</text><text x="688" y="862" font-size="21">项目、资料、脚本、Skill、配置与依赖</text><text x="688" y="905" font-size="20" fill="#795d2b">放在容器系统层之外，重建后重新挂载</text><text x="60" y="1032" font-size="19" fill="#53687b">Docker方案逻辑示意；个人目录独立保存，不表示备份或独占物理硬件。</text></g></svg>